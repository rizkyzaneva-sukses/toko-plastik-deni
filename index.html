    <script>
      (function() {
        try {
          var saved = localStorage.getItem('tokoplastik_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 min-h-screen antialiased selection:bg-amber-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
